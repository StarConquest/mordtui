[package]
name = "mordtui"
version = "0.1.0"
edition = "2024"
description = "Offline Mordheim campaign manager with an auditable CSV database and terminal UI"
license = "MIT"
default-run = "mordheim"

[[bin]]
name = "mordheim"
path = "src/main.rs"

[features]
default = []
ai = ["dep:rig-core", "dep:tokio", "dep:reqwest"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
csv = "1"
fs2 = "0.4"
rand = "0.9"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
rig-core = { version = "0.24", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }

